name: CI

on: [push]

jobs:
  tradingview-clone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingview-clone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tradingview-clone/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:standalone
